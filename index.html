<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biudžetas</title>
<meta name="description" content="Paprasta mėnesio išlaidų apskaita telefone.">
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Biudžetas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2;
  --surface: #fcfcfb;
  --surface-2: #efefec;
  --line: #e2e1dc;
  --text: #0b0b0b;
  --text-2: #52514e;
  --text-3: #85847e;
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --danger: #c62f2e;
  --good: #1f7a3a;
  --c0:#2a78d6; --c1:#eb6834; --c2:#1baf7a; --c3:#eda100;
  --c4:#e87ba4; --c5:#008300; --c6:#6250d6; --c7:#e34948;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110;
    --surface: #1a1a19;
    --surface-2: #252523;
    --line: #2f2f2c;
    --text: #f0efec;
    --text-2: #c3c2b7;
    --text-3: #8d8c84;
    --accent: #3987e5;
    --danger: #ef7171;
    --good: #5cc47a;
    --c0:#3987e5; --c1:#d95926; --c2:#199e70; --c3:#c98500;
    --c4:#d55181; --c5:#008300; --c6:#9085e9; --c7:#e66767;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --surface-2: #252523; --line: #2f2f2c;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8d8c84; --accent: #3987e5;
  --danger: #ef7171; --good: #5cc47a;
  --c0:#3987e5; --c1:#d95926; --c2:#199e70; --c3:#c98500;
  --c4:#d55181; --c5:#008300; --c6:#9085e9; --c7:#e66767;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  min-height: 100dvh;
  overscroll-behavior-y: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 96px); }

/* Header */
.top { display: flex; align-items: center; gap: 8px; padding: 8px 0 12px; }
.top h1 { flex: 1; text-align: center; font-size: 18px; margin: 0; font-weight: 650; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--surface); box-shadow: var(--shadow); font-size: 20px; display: grid; place-items: center; }
.iconbtn:disabled { opacity: .35; }
.today-link { display: block; text-align: center; margin: -6px 0 10px; font-size: 14px; color: var(--accent); background: none; border: 0; width: 100%; }

.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
.card h2 { font-size: 15px; margin: 0 0 12px; color: var(--text-2); font-weight: 600; }
.hero .label { color: var(--text-2); font-size: 14px; }
.hero .big { font-size: 40px; font-weight: 700; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.hero .sub { color: var(--text-2); font-size: 14px; margin-top: 2px; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin-top: 10px; }
.bar > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.bar.over > i { background: var(--danger); }
.over-text { color: var(--danger); font-weight: 600; }
.good-text { color: var(--good); font-weight: 600; }

.catrow { display: grid; grid-template-columns: 36px 1fr auto; gap: 4px 10px; align-items: center; padding: 6px 0; }
.catrow .nm { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.catrow .am { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.catrow .bar { grid-column: 2 / 4; margin-top: 0; height: 6px; }
.catrow .lim { grid-column: 2 / 4; font-size: 12px; color: var(--text-3); margin-top: -2px; }
.bubble { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; position: relative; }
.bubble::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: .16; }

.day { margin: 18px 4px 6px; display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); font-weight: 600; }
.list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.item { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; width: 100%; border: 0; background: none; text-align: left; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item:active { background: var(--surface-2); }
.item .t1 { font-size: 15px; }
.item .t2 { font-size: 13px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .am { font-weight: 600; font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--text-3); padding: 28px 16px; }
.banner { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; color: var(--text-2); width: 100%; text-align: left; }

/* FAB */
.fab { position: fixed; right: max(20px, calc(50% - 260px)); bottom: calc(env(safe-area-inset-bottom) + 84px); width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 34px; line-height: 1; box-shadow: 0 6px 20px rgba(42,120,214,.4); z-index: 20; }
.fab:active { transform: scale(.95); }

/* Bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 15; }
.nav-in { display: flex; width: 100%; max-width: 560px; }
.nav button { flex: 1; border: 0; background: none; padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--text-3); }
.nav button .ic { font-size: 22px; filter: grayscale(1); opacity: .7; }
.nav button.on { color: var(--accent); font-weight: 600; }
.nav button.on .ic { filter: none; opacity: 1; }

/* Sheet */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 12px 16px calc(env(safe-area-inset-bottom) + 16px); max-height: 92dvh; overflow-y: auto; animation: up .2s ease-out; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
.sheet h3 { margin: 0 0 12px; font-size: 18px; }
@keyframes up { from { transform: translateY(40px); opacity: .6; } }
@keyframes fade { from { opacity: 0; } }
.amount-in { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--accent); margin-bottom: 14px; }
.amount-in input { flex: 1; min-width: 0; border: 0; background: none; font-size: 44px; font-weight: 700; padding: 4px 0; outline: none; font-variant-numeric: tabular-nums; }
.amount-in span { font-size: 32px; color: var(--text-2); font-weight: 600; }
.chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.chip { border: 2px solid transparent; background: var(--surface-2); border-radius: 12px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; min-height: 64px; }
.chip .e { font-size: 22px; }
.chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.chip.on { border-color: var(--accent); background: var(--surface); }
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 4px; }
.field input, .field select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 16px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 15px; font-size: 17px; font-weight: 650; background: var(--accent); color: var(--accent-ink); margin-top: 6px; }
.btn.ghost { background: var(--surface-2); color: var(--text); }
.btn.danger { background: none; color: var(--danger); }
.btn:disabled { opacity: .45; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.sw { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 2px transparent; }
.sw.on { box-shadow: 0 0 0 2px var(--text); }
.emojis { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.emojis button { width: 40px; height: 40px; border-radius: 10px; border: 0; background: var(--surface-2); font-size: 20px; }

/* Settings list */
.setrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.setrow:first-of-type { border-top: 0; }
.setrow .grow { flex: 1; min-width: 0; }
.setrow .muted { color: var(--text-3); font-size: 13px; }
.chev { color: var(--text-3); }
.hint { font-size: 13px; color: var(--text-3); margin: 8px 0 0; }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btnrow .btn { font-size: 15px; padding: 12px; margin: 0; }

/* Charts */
.legend { margin-top: 12px; }
.legend .lr { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 8px; align-items: center; padding: 6px 0; font-size: 14px; border-top: 1px solid var(--line); }
.legend .lr:first-child { border-top: 0; }
.legend .dot { width: 12px; height: 12px; border-radius: 3px; }
.legend .pc { color: var(--text-3); font-variant-numeric: tabular-nums; width: 42px; text-align: right; }
.legend .v { font-weight: 600; font-variant-numeric: tabular-nums; }
svg text { fill: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .hit { fill: transparent; }
svg .hit:hover + .mk, svg .mk.hl { opacity: .75; }
.tip { max-width: calc(100vw - 16px); overflow: hidden; text-overflow: ellipsis; position: fixed; z-index: 60; pointer-events: none; background: var(--text); color: var(--bg); font-size: 13px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); box-shadow: var(--shadow); }
.donut-wrap { position: relative; width: 220px; height: 220px; margin: 0 auto; }
.donut-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
.donut-center b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.donut-center small { color: var(--text-2); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 160px); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 70; font-size: 14px; animation: fade .2s; max-width: calc(100% - 32px); }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<button class="fab" id="fab" aria-label="Pridėti išlaidas">+</button>
<nav class="nav"><div class="nav-in" id="nav">
  <button data-tab="month"><span class="ic">📅</span>Mėnuo</button>
  <button data-tab="charts"><span class="ic">📊</span>Grafikai</button>
  <button data-tab="history"><span class="ic">🗂️</span>Istorija</button>
  <button data-tab="settings"><span class="ic">⚙️</span>Nustatymai</button>
</div></nav>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script>
"use strict";
// ---------- Duomenys ----------
const KEY = "biudzetas.v1";
const MONTHS = ["Sausis","Vasaris","Kovas","Balandis","Gegužė","Birželis","Liepa","Rugpjūtis","Rugsėjis","Spalis","Lapkritis","Gruodis"];
const MONTHS_GEN = ["sausio","vasario","kovo","balandžio","gegužės","birželio","liepos","rugpjūčio","rugsėjo","spalio","lapkričio","gruodžio"];
const MONTHS_SHORT = ["Sau","Vas","Kov","Bal","Geg","Bir","Lie","Rgp","Rgs","Spa","Lap","Grd"];
const WEEKDAYS = ["sekmadienis","pirmadienis","antradienis","trečiadienis","ketvirtadienis","penktadienis","šeštadienis"];
const EMOJIS = ["🛒","🏠","💡","🚗","⛽","🚌","💊","🎉","👕","🍽️","☕","🎁","📱","🐶","👶","📚","✈️","💇","🏋️","🔧","💳","🧾","🍺","📦"];
const DEFAULT_CATS = [
  ["Maistas","🛒",0],["Būstas, komunalinės","🏠",1],["Transportas","🚗",2],["Sveikata","💊",3],
  ["Pramogos","🎉",4],["Drabužiai","👕",5],["Kavinės","🍽️",6],["Kita","📦",7]
];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const curYM = () => todayStr().slice(0, 7);
const ymOf = date => date.slice(0, 7);
const ymAdd = (ym, n) => { let [y, m] = ym.split("-").map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${pad(m)}`; };
const ymLabel = ym => { const [y, m] = ym.split("-").map(Number); return `${MONTHS[m-1]} ${y}`; };
const daysIn = ym => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const eurFmt = new Intl.NumberFormat("lt-LT", { style: "currency", currency: "EUR" });
const eur = cents => eurFmt.format(cents / 100);
const eurShort = cents => { const v = cents / 100; return v >= 1000 ? (v/1000).toFixed(v >= 10000 ? 0 : 1).replace(".", ",") + " k€" : Math.round(v) + " €"; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const parseAmt = s => { const v = parseFloat(String(s).replace(/\s/g, "").replace(",", ".")); return isFinite(v) ? Math.round(v * 100) : NaN; };
const color = i => `var(--c${((i % 8) + 8) % 8})`;

function freshState() {
  return { v: 1, cats: DEFAULT_CATS.map(([name, icon, c]) => ({ id: uid(), name, icon, color: c, limit: 0 })), items: [], budget: 0, lastBackup: null };
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.cats) && Array.isArray(s.items)) return s; } catch (e) {}
  return freshState();
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast("Nepavyko išsaugoti – patikrinkite vietą telefone"); }
}
save();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

const catById = id => S.cats.find(c => c.id === id) || { id, name: "Nežinoma", icon: "❔", color: 7, limit: 0 };
const monthItems = ym => S.items.filter(i => ymOf(i.date) === ym);
const sum = arr => arr.reduce((a, i) => a + i.amt, 0);

// ---------- Būsena ----------
let tab = "month";
let viewYM = curYM();
let lastSeenYM = curYM();

// Naujas mėnuo: jei programėlė buvo atidaryta per mėnesio sandūrą – perjungiame į naują mėnesį
function checkMonthRollover() {
  const now = curYM();
  if (now !== lastSeenYM) { if (viewYM === lastSeenYM) viewYM = now; lastSeenYM = now; render(); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkMonthRollover(); });
setInterval(checkMonthRollover, 60000);

const $app = document.getElementById("app");
const $fab = document.getElementById("fab");

function render() {
  hideTip();
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $fab.classList.toggle("hidden", tab === "settings");
  if (tab === "month") renderMonth();
  else if (tab === "charts") renderCharts();
  else if (tab === "history") renderHistory();
  else renderSettings();
}

function monthHeader() {
  const isCur = viewYM === curYM();
  return `<div class="top">
    <button class="iconbtn" data-act="prev" aria-label="Ankstesnis mėnuo">‹</button>
    <h1>${ymLabel(viewYM)}</h1>
    <button class="iconbtn" data-act="next" aria-label="Kitas mėnuo" ${isCur ? "disabled" : ""}>›</button>
  </div>${isCur ? "" : `<button class="today-link" data-act="today">Grįžti į einamąjį mėnesį</button>`}`;
}

// ---------- Mėnuo ----------
function renderMonth() {
  const items = monthItems(viewYM).sort((a, b) => b.date.localeCompare(a.date) || b.ts - a.ts);
  const total = sum(items);
  const isCur = viewYM === curYM();
  let h = monthHeader();

  const needBackup = S.items.length >= 5 && (!S.lastBackup || Date.now() - S.lastBackup > 30 * 864e5);
  if (needBackup && isCur) h += `<button class="banner" data-act="go-settings">💾 <span>Seniai darėte atsarginę kopiją. Paspauskite ir išsaugokite duomenis.</span></button>`;

  if (!isStandalone() && isCur) h += `<button class="banner" data-act="go-settings">📲 <span>Įsidiekite programėlę į telefoną – paspauskite, parodysiu kaip.</span></button>`;

  h += `<div class="card hero"><div class="label">Išleista per mėnesį</div><div class="big">${eur(total)}</div>`;
  if (S.budget > 0) {
    const left = S.budget - total, pct = Math.min(100, total / S.budget * 100);
    h += `<div class="bar ${left < 0 ? "over" : ""}"><i style="width:${pct}%"></i></div>
      <div class="sub">${left >= 0 ? `Liko <span class="good-text">${eur(left)}</span>` : `<span class="over-text">⚠ Viršyta ${eur(-left)}</span>`} iš ${eur(S.budget)}`;
    if (isCur && left > 0) {
      const dLeft = daysIn(viewYM) - new Date().getDate() + 1;
      h += ` · ~${eur(Math.floor(left / dLeft))}/d.`;
    }
    h += `</div>`;
  } else {
    h += `<div class="sub">${items.length} įraš. · <button style="border:0;background:none;color:var(--accent);padding:0" data-act="go-settings">nustatyti biudžetą</button></div>`;
  }
  h += `</div>`;

  // Pagal grupes
  const byCat = new Map();
  items.forEach(i => byCat.set(i.cat, (byCat.get(i.cat) || 0) + i.amt));
  const limited = S.cats.filter(c => c.limit > 0 && !byCat.has(c.id));
  if (byCat.size || limited.length) {
    const rows = [...byCat.entries()].sort((a, b) => b[1] - a[1]);
    const max = Math.max(...rows.map(r => r[1]), 1);
    h += `<div class="card"><h2>Pagal grupes</h2>`;
    for (const [id, v] of rows.concat(limited.map(c => [c.id, 0]))) {
      const c = catById(id);
      const over = c.limit > 0 && v > c.limit;
      const w = c.limit > 0 ? Math.min(100, v / c.limit * 100) : v / max * 100;
      h += `<div class="catrow"><div class="bubble" style="color:${color(c.color)}">${esc(c.icon)}</div>
        <div class="nm">${esc(c.name)}</div><div class="am">${eur(v)}</div>
        <div class="bar ${over ? "over" : ""}"><i style="width:${w}%;${over ? "" : `background:${color(c.color)}`}"></i></div>
        ${c.limit > 0 ? `<div class="lim">${over ? `<span class="over-text">⚠ viršyta ${eur(v - c.limit)}</span>` : `liko ${eur(c.limit - v)}`} iš ${eur(c.limit)}</div>` : ""}
      </div>`;
    }
    h += `</div>`;
  }

  // Sąrašas pagal dienas
  if (!items.length) {
    h += `<div class="empty">${isCur ? "Šį mėnesį išlaidų dar nėra.<br>Spauskite <b>+</b> ir pridėkite pirmąsias." : "Šį mėnesį išlaidų nebuvo."}</div>`;
  } else {
    let day = null;
    for (const it of items) {
      if (it.date !== day) {
        if (day) h += `</div>`;
        day = it.date;
        const d = new Date(day + "T12:00:00");
        const dTot = sum(items.filter(x => x.date === day));
        h += `<div class="day"><span>${MONTHS_GEN[d.getMonth()]} ${d.getDate()} d., ${WEEKDAYS[d.getDay()]}</span><span>${eur(dTot)}</span></div><div class="list">`;
      }
      const c = catById(it.cat);

// ---------- Grafikai ----------
function renderCharts() {
  const items = monthItems(viewYM);
  const total = sum(items);
  let h = monthHeader();

  // Donut pagal grupes
  const byCat = new Map();
  items.forEach(i => byCat.set(i.cat, (byCat.get(i.cat) || 0) + i.amt));
  let rows = [...byCat.entries()].sort((a, b) => b[1] - a[1]).map(([id, v]) => { const c = catById(id); return { name: c.name, icon: c.icon, col: color(c.color), v }; });
  if (rows.length > 8) {
    const rest = rows.slice(7);
    rows = rows.slice(0, 7).concat([{ name: `Kitos (${rest.length})`, icon: "…", col: "var(--text-3)", v: rest.reduce((a, r) => a + r.v, 0) }]);
  }
  h += `<div class="card"><h2>Išlaidos pagal grupes</h2>`;
  if (!total) h += `<div class="empty">Šį mėnesį duomenų nėra.</div>`;
  else {
    const R = 100, r = 66, cx = 110, cy = 110;
    let a0 = -Math.PI / 2, svg = "";
    const gap = rows.length > 1 ? 0.012 : 0;
    rows.forEach((row, idx) => {
      const frac = row.v / total;
      const a1 = a0 + frac * Math.PI * 2;
      const tip = `${row.icon} ${row.name}: ${eur(row.v)} (${Math.round(frac * 100)}%)`;
      if (frac >= 0.9999) {
        svg += `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="${row.col}" stroke-width="${R - r}" data-tip="${esc(tip)}"/>`;
      } else {
        const s = a0 + gap, e = Math.max(s + 0.001, a1 - gap);
        const large = e - s > Math.PI ? 1 : 0;
        const p = (rad, ang) => `${(cx + rad * Math.cos(ang)).toFixed(2)} ${(cy + rad * Math.sin(ang)).toFixed(2)}`;
        svg += `<path d="M${p(R, s)} A${R} ${R} 0 ${large} 1 ${p(R, e)} L${p(r, e)} A${r} ${r} 0 ${large} 0 ${p(r, s)}Z" fill="${row.col}" data-tip="${esc(tip)}" class="mk"/>`;
      }
      a0 = a1;
    });
    h += `<div class="donut-wrap"><svg viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Išlaidų pasiskirstymas pagal grupes">${svg}</svg>
      <div class="donut-center"><div><b>${eur(total)}</b><small>iš viso</small></div></div></div>
      <div class="legend">${rows.map(row => `<div class="lr"><span class="dot" style="background:${row.col}"></span><span>${esc(row.icon)} ${esc(row.name)}</span><span class="pc">${Math.round(row.v / total * 100)}%</span><span class="v">${eur(row.v)}</span></div>`).join("")}</div>`;
  }
  h += `</div>`;

  // Per dienas
  const nd = daysIn(viewYM);
  const daily = Array.from({ length: nd }, () => 0);
  items.forEach(i => { daily[Number(i.date.slice(8, 10)) - 1] += i.amt; });
  h += `<div class="card"><h2>Išlaidos per dienas</h2>${barChart(daily.map((v, i) => ({
    v, label: (i + 1) % 5 === 0 || i === 0 ? String(i + 1) : "", tip: `${MONTHS_GEN[Number(viewYM.slice(5)) - 1]} ${i + 1} d.: ${eur(v)}`
  })), {})}</div>`;

  // 12 mėnesių
  const months = Array.from({ length: 12 }, (_, i) => ymAdd(viewYM, i - 11));
  const mTot = new Map();
  S.items.forEach(i => { const k = ymOf(i.date); mTot.set(k, (mTot.get(k) || 0) + i.amt); });
  const mv = months.map(ym => mTot.get(ym) || 0);
  const nonZero = mv.filter(v => v > 0);
  const avg = nonZero.length ? Math.round(nonZero.reduce((a, b) => a + b, 0) / nonZero.length) : 0;
  h += `<div class="card"><h2>Paskutiniai 12 mėnesių</h2>${barChart(months.map((ym, i) => ({
    v: mv[i], label: MONTHS_SHORT[Number(ym.slice(5)) - 1], tip: `${ymLabel(ym)}: ${eur(mv[i])}`, hl: ym === viewYM
  })), { ref: S.budget > 0 ? { v: S.budget, label: "biudžetas" } : null })}
  <p class="hint">Vidutiniškai per mėnesį (kai buvo išlaidų): <b>${eur(avg)}</b></p></div>`;

  $app.innerHTML = h;
}

function barChart(data, opts) {
  const W = 340, H = 170, padL = 40, padB = 20, padT = 10, padR = 4;
  const ref = opts.ref;
  const maxV = Math.max(1, ...data.map(d => d.v), ref ? ref.v : 0);
  const step = niceStep(maxV / 3);
  const top = Math.ceil(maxV / step) * step;
  const ih = H - padB - padT, iw = W - padL - padR;
  const y = v => padT + ih - v / top * ih;
  let s = "";
  for (let g = 0; g <= top + 1; g += step) {
    s += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${y(g)}" y2="${y(g)}"/><text x="${padL - 6}" y="${y(g) + 4}" text-anchor="end">${eurShort(g)}</text>`;
  }
  const slot = iw / data.length;
  const bw = Math.max(3, Math.min(22, slot - 2));
  data.forEach((d, i) => {
    const x = padL + i * slot + (slot - bw) / 2;
    const bh = d.v > 0 ? Math.max(2, d.v / top * ih) : 0;
    const by = padT + ih - bh;
    const rr = Math.min(4, bw / 2, bh);
    s += `<rect class="hit" x="${padL + i * slot}" y="${padT}" width="${slot}" height="${ih + padB}" data-tip="${esc(d.tip)}"/>`;
    if (bh > 0) s += `<path class="mk" pointer-events="none" fill="var(--accent)" opacity="${d.hl === false ? .5 : 1}" d="M${x} ${by + bh}V${by + rr}Q${x} ${by} ${x + rr} ${by}H${x + bw - rr}Q${x + bw} ${by} ${x + bw} ${by + rr}V${by + bh}Z"/>`;
    if (d.label) s += `<text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle" ${d.hl ? 'style="fill:var(--text);font-weight:700"' : ""}>${esc(d.label)}</text>`;
  });
  if (ref) s += `<line x1="${padL}" x2="${W - padR}" y1="${y(ref.v)}" y2="${y(ref.v)}" stroke="var(--text-2)" stroke-dasharray="4 3" stroke-width="1.5" pointer-events="none"/><text x="${W - padR}" y="${y(ref.v) - 4}" text-anchor="end" style="fill:var(--text-2)">${ref.label}</text>`;
  s += `<line x1="${padL}" x2="${W - padR}" y1="${padT + ih}" y2="${padT + ih}" stroke="var(--text-3)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${s}</svg>`;
}
function niceStep(x) {
  const e = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1))));
  const f = x / e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e;
}

// Patarimai (tooltip) paspaudus ant grafiko
let $tip = null;
function showTip(text, x, y) {
  if (!$tip) { $tip = document.createElement("div"); $tip.className = "tip"; document.body.appendChild($tip); }
  $tip.textContent = text;
  $tip.classList.remove("hidden");
  const half = $tip.offsetWidth / 2 + 8;
  $tip.style.left = Math.min(window.innerWidth - half, Math.max(half, x)) + "px";
  $tip.style.top = y + "px";
  $tip.classList.remove("hidden");
}
function hideTip() { if ($tip) $tip.classList.add("hidden"); }
$app.addEventListener("pointermove", e => { const t = e.target.closest("[data-tip]"); if (t && e.pointerType === "mouse") showTip(t.dataset.tip, e.clientX, e.clientY); else if (e.pointerType === "mouse") hideTip(); });
$app.addEventListener("pointerdown", e => { const t = e.target.closest("[data-tip]"); if (t) showTip(t.dataset.tip, e.clientX, e.clientY); else hideTip(); });
window.addEventListener("scroll", hideTip, { passive: true });

function renderHistory() {
  const mTot = new Map(), mCnt = new Map();
  S.items.forEach(i => { const k = ymOf(i.date); mTot.set(k, (mTot.get(k) || 0) + i.amt); mCnt.set(k, (mCnt.get(k) || 0) + 1); });
  mTot.set(curYM(), mTot.get(curYM()) || 0);
  const yms = [...mTot.keys()].sort().reverse();
  let h = `<div class="top"><h1>Istorija</h1></div>`;
  let year = null;
  for (const ym of yms) {
    const y = ym.slice(0, 4);
    if (y !== year) {
      if (year) h += `</div>`;
      year = y;
      const yTot = [...mTot.entries()].filter(([k]) => k.startsWith(y)).reduce((a, [, v]) => a + v, 0);
      h += `<div class="day"><span>${y} m.</span><span>${eur(yTot)}</span></div><div class="list">`;
    }
    const v = mTot.get(ym);
    let sub = `${mCnt.get(ym) || 0} įraš.`;
    if (S.budget > 0 && v > 0) sub += v > S.budget ? ` · <span class="over-text">viršyta ${eur(v - S.budget)}</span>` : ` · sutaupyta ${eur(S.budget - v)}`;
    const top = topCat(ym);
    if (top) sub += ` · daugiausia: ${esc(top.icon)} ${esc(top.name)}`;
    h += `<button class="item" data-month="${ym}"><div class="bubble" style="color:var(--accent)">🗓️</div>
      <div style="min-width:0"><div class="t1">${ymLabel(ym)}${ym === curYM() ? " (dabar)" : ""}</div><div class="t2">${sub}</div></div>
      <div class="am">${eur(v)}</div></button>`;
  }
  h += `</div><p class="hint">Paspauskite mėnesį, kad pamatytumėte jo išlaidas ir grafikus.</p>`;
  $app.innerHTML = h;
}
function topCat(ym) {
  const m = new Map();
  monthItems(ym).forEach(i => m.set(i.cat, (m.get(i.cat) || 0) + i.amt));
  let best = null, bv = 0;
  m.forEach((v, k) => { if (v > bv) { bv = v; best = k; } });
  return best ? catById(best) : null;
}

}
function closeSheet() {
  const ov = document.getElementById("overlay");

function expenseSheet(item) {
  const isNew = !item;
  const defDate = viewYM === curYM() ? todayStr() : `${viewYM}-01`;

  openSheet(`<h3>${isNew ? "Naujos išlaidos" : "Redaguoti išlaidas"}</h3>

    <div class="chips" id="chips">${S.cats.map(c => `<button class="chip ${c.id === sel ? "on" : ""}" data-c="${c.id}"><span class="e">${esc(c.icon)}</span><span>${esc(c.name)}</span></button>`).join("")}</div>
    <div class="row2"><label class="field"><span>Data</span><input type="date" id="dt" value="${item ? item.date : defDate}" max="${todayStr()}"></label>
    <label class="field"><span>Pastaba (nebūtina)</span><input id="nt" maxlength="80" value="${item ? esc(item.note) : ""}" placeholder="pvz. Maxima"></label></div>
    <button class="btn" id="saveBtn">Išsaugoti</button>
    ${isNew ? `<button class="btn ghost" id="cancelBtn">Atšaukti</button>` : `<button class="btn danger" id="delBtn">Ištrinti</button>`}`,
    sh => {
      const amt = sh.querySelector("#amt");
      if (isNew) setTimeout(() => amt.focus(), 50);

      });

        if (!(v > 0)) { toast("Įveskite sumą"); amt.focus(); return; }
        if (!sel) { toast("Pasirinkite grupę"); return; }
        const date = sh.querySelector("#dt").value || todayStr();
        const note = sh.querySelector("#nt").value.trim();
        if (isNew) S.items.push({ id: uid(), amt: v, cat: sel, note, date, ts: Date.now() });
        else Object.assign(item, { amt: v, cat: sel, note, date });
        save(); closeSheet();
        if (ymOf(date) !== viewYM && ymOf(date) <= curYM()) viewYM = ymOf(date);

      const del = sh.querySelector("#delBtn");

        if (!confirm("Ištrinti šias išlaidas?")) return;
        S.items = S.items.filter(i => i !== item); save(); closeSheet(); render(); toast("Ištrinta");
      });
      const cancel = sh.querySelector("#cancelBtn");
      if (cancel) cancel.addEventListener("click", closeSheet);
    });

function catSheet(cat) {
  const isNew = !cat;
  const c = cat ? { ...cat } : { name: "", icon: "📦", color: S.cats.length % 8, limit: 0 };
  const idx = cat ? S.cats.indexOf(cat) : -1;
  openSheet(`<h3>${isNew ? "Nauja grupė" : "Redaguoti grupę"}</h3>

    <label class="field"><span>Mėnesio limitas grupei (nebūtina)</span><input id="cl" inputmode="decimal" value="${c.limit ? (c.limit / 100).toString().replace(".", ",") : ""}" placeholder="pvz. 400"></label>
    ${!isNew ? `<div class="btnrow" style="margin-bottom:8px"><button class="btn ghost" id="upBtn" ${idx === 0 ? "disabled" : ""}>↑ Aukštyn</button><button class="btn ghost" id="downBtn" ${idx === S.cats.length - 1 ? "disabled" : ""}>↓ Žemyn</button></div>` : ""}
    <button class="btn" id="saveBtn">Išsaugoti</button>
    ${isNew ? `<button class="btn ghost" id="cancelBtn">Atšaukti</button>` : `<button class="btn danger" id="delBtn">Ištrinti grupę</button>`}`,
    sh => {
      const ci = sh.querySelector("#ci");
      sh.querySelector("#emo").addEventListener("click", e => { const b = e.target.closest("[data-e]"); if (b) ci.value = b.dataset.e; });
      sh.querySelector("#sws").addEventListener("click", e => {

        sh.querySelectorAll(".sw").forEach(x => x.classList.toggle("on", x === b));
      });
      sh.querySelector("#saveBtn").addEventListener("click", () => {
        const name = sh.querySelector("#cn").value.trim();
        if (!name) { toast("Įveskite pavadinimą"); return; }
        const lim = sh.querySelector("#cl").value.trim();
        const limit = lim ? parseAmt(lim) : 0;
        if (isNaN(limit) || limit < 0) { toast("Neteisingas limitas"); return; }
        const upd = { name, icon: ci.value.trim() || "📦", color: c.color, limit };
        if (isNew) S.cats.push({ id: uid(), ...upd }); else Object.assign(cat, upd);
        save(); closeSheet(); render(); toast("Išsaugota");
      });
      const move = d => { const j = idx + d; [S.cats[idx], S.cats[j]] = [S.cats[j], S.cats[idx]]; save(); closeSheet(); render(); catSheet(cat); };
      sh.querySelector("#upBtn")?.addEventListener("click", () => move(-1));
      sh.querySelector("#downBtn")?.addEventListener("click", () => move(1));
      sh.querySelector("#cancelBtn")?.addEventListener("click", closeSheet);
      sh.querySelector("#delBtn")?.addEventListener("click", () => {
        if (S.cats.length <= 1) { toast("Turi likti bent viena grupė"); return; }
        const n = S.items.filter(i => i.cat === cat.id).length;
        const others = S.cats.filter(x => x !== cat);
        const target = others.find(x => x.name === "Kita") || others[others.length - 1];
        const msg = n ? `Ištrinti grupę „${cat.name}“? Jos ${n} įraš. bus perkelta į „${target.name}“.` : `Ištrinti grupę „${cat.name}“?`;
        if (!confirm(msg)) return;
        S.items.forEach(i => { if (i.cat === cat.id) i.cat = target.id; });
        S.cats = others; save(); closeSheet(); render(); toast("Grupė ištrinta");
      });
    });
}

// ---------- Atsarginės kopijos ----------
async function shareOrDownload(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  try {
    const file = new File([blob], filename, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename });
      return true;
    }
  } catch (e) { if (e && e.name === "AbortError") return false; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return true;
}
async function exportJSON() {
  const ok = await shareOrDownload(`biudzetas-${todayStr()}.json`, JSON.stringify({ ...S, exportedAt: new Date().toISOString() }, null, 1), "application/json");
  if (ok) { S.lastBackup = Date.now(); save(); render(); toast("Kopija paruošta"); }
}
function exportCSV(onlyMonth) {
  const rows = (onlyMonth ? monthItems(viewYM) : S.items.slice()).sort((a, b) => a.date.localeCompare(b.date));
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const lines = ["Data;Grupė;Suma EUR;Pastaba", ...rows.map(i => [i.date, q(catById(i.cat).name), (i.amt / 100).toFixed(2).replace(".", ","), q(i.note || "")].join(";"))];
  shareOrDownload(`islaidos-${onlyMonth ? viewYM : "visos"}.csv`, "﻿" + lines.join("\r\n"), "text/csv");
}
document.getElementById("importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch (err) { toast("Netinkamas failas"); return; }
  if (!data || !Array.isArray(data.cats) || !Array.isArray(data.items)) { toast("Tai ne biudžeto kopija"); return; }
  openSheet(`<h3>Atkurti kopiją</h3>
    <p>Faile: <b>${data.items.length}</b> įraš., <b>${data.cats.length}</b> grup.</p>
    <button class="btn" id="mergeBtn">Sujungti su esamais duomenimis</button>
    <button class="btn ghost" id="replaceBtn">Pakeisti visus duomenis</button>
    <button class="btn danger" id="cancelBtn">Atšaukti</button>`, sh => {
    sh.querySelector("#cancelBtn").addEventListener("click", closeSheet);
    sh.querySelector("#replaceBtn").addEventListener("click", () => {
      if (!confirm("Dabartiniai duomenys bus pakeisti. Tęsti?")) return;
      S = { ...freshState(), ...data, v: 1 }; delete S.exportedAt;
      save(); closeSheet(); viewYM = curYM(); render(); toast("Duomenys atkurti");
    });
    sh.querySelector("#mergeBtn").addEventListener("click", () => {
      const cIds = new Set(S.cats.map(c => c.id)), iIds = new Set(S.items.map(i => i.id));
      data.cats.forEach(c => { if (!cIds.has(c.id)) S.cats.push(c); });
      let added = 0;
      data.items.forEach(i => { if (!iIds.has(i.id)) { S.items.push(i); added++; } });
      save(); closeSheet(); render(); toast(`Pridėta ${added} įraš.`);
    });
  });
});

// ---------- Įvykiai ----------
document.getElementById("nav").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  tab = b.dataset.tab; render(); window.scrollTo(0, 0);
});
$fab.addEventListener("click", () => expenseSheet(null));
$app.addEventListener("click", async e => {
  const t = e.target.closest("[data-act],[data-edit],[data-month],[data-cat]");
  if (!t) return;
  if (t.dataset.edit) { const it = S.items.find(i => i.id === t.dataset.edit); if (it) expenseSheet(it); return; }
  if (t.dataset.month) { viewYM = t.dataset.month; tab = "month"; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.cat) { catSheet(S.cats.find(c => c.id === t.dataset.cat)); return; }
  switch (t.dataset.act) {
    case "prev": viewYM = ymAdd(viewYM, -1); render(); break;
    case "next": if (viewYM < curYM()) { viewYM = ymAdd(viewYM, 1); render(); } break;
    case "today": viewYM = curYM(); render(); break;
    case "go-settings": tab = "settings"; render(); window.scrollTo(0, 0); break;
    case "new-cat": catSheet(null); break;
    case "export": exportJSON(); break;
    case "import": document.getElementById("importFile").click(); break;
    case "csv-month": exportCSV(true); break;
    case "csv-all": exportCSV(false); break;
    case "install": if (deferredInstall) { deferredInstall.prompt(); await deferredInstall.userChoice.catch(() => {}); deferredInstall = null; render(); } break;
    case "wipe":
      if (confirm("Ištrinti VISUS duomenis? Rekomenduojame prieš tai išsaugoti kopiją.") && confirm("Tikrai? To atšaukti nebus galima.")) {
        S = freshState(); save(); viewYM = curYM(); tab = "month"; render(); toast("Duomenys ištrinti");
      }
      break;
  }
});

let toastTimer;
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const d = document.createElement("div"); d.className = "toast"; d.textContent = msg;
  document.body.appendChild(d);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => d.remove(), 2200);
}

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
